[package]
name = "nv-telemetry-codegen"
description = "Schema compiler for nv-telemetry: validators, wrappers, hashing, and projections"
# A repository tool: generated code is checked in.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A build-time tool. Nothing that consumes the data plane depends on this
# crate, because generated code is checked in.
[[bin]]
name = "nv-telemetry-codegen"
path = "src/main.rs"

[dependencies]
heck.workspace = true
nv-redfish-csdl-compiler.workspace = true
nv-redfish-schema.workspace = true
nv-telemetry-schema.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
prost-build.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
syn.workspace = true

[dev-dependencies]
# Fixture schemas for compiler tests are compiled in-process; the depth and
# fidelity tests encode dynamic messages and compare them against the
# generated types. The Redfish source is also a compile fixture for projection
# output: the manifest golden proves emitted bytes equal its checked-in module,
# and this dependency makes rustc resolve that module during codegen tests.
nv-telemetry-redfish = { path = "../sources/redfish" }
nv-telemetry-source.workspace = true
prost.workspace = true
protox.workspace = true

[lints]
workspace = true
