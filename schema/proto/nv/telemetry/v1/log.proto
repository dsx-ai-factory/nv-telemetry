// Log records.

syntax = "proto3";

package nv.telemetry.v1;

import "nv/telemetry/options/v1/annotations.proto";
import "nv/telemetry/v1/subject.proto";
import "nv/telemetry/v1/value.proto";

option csharp_namespace = "Nvidia.NvTelemetry.V1";
option go_package = "github.com/NVIDIA/nv-telemetry/gen/nv/telemetry/v1;telemetryv1";
option java_package = "com.nvidia.nvtelemetry.v1";

// The contract's own severity ladder. Source severities are mapped into it by
// projection; a value the mapping does not cover is a projection issue rather
// than a guess, which is why a record may carry no severity but never carries
// UNSPECIFIED.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_DEBUG = 1;
  SEVERITY_INFO = 2;
  SEVERITY_WARNING = 3;
  SEVERITY_ERROR = 4;
  SEVERITY_CRITICAL = 5;
}

message LogRecord {
  option (nv.telemetry.options.v1.message_invariant) = {validated: true};

  // When the device says it happened, which is a different fact from when it
  // was collected; the batch window carries the latter. Absent when the
  // source does not stamp entries.
  optional Timestamp occurred_at = 1;

  // Absent when the source does not state one, or states one the mapping does
  // not cover. Never UNSPECIFIED: a record claiming a severity of "not stated"
  // would sort into the ladder below debug.
  optional Severity severity = 2 [(nv.telemetry.options.v1.field_invariant) = {reject_unspecified: true}];

  // Deliberately not `non_empty`, unlike every other required string here.
  // This is the one that carries verbatim device text rather than an
  // identifier or a projected vocabulary token, and a Redfish LogEntry whose
  // human-readable Message is empty because the text lives in a message
  // registry under MessageId is ordinary, not malformed. Rejecting it would
  // fail the whole batch and discard every other record the device did report,
  // to punish one field for saying what the device said.
  optional string message = 3 [(nv.telemetry.options.v1.field_invariant) = {
    required: true
    max_len: 65536
  }];

  // The resource the record is about, when the source names one — a Redfish
  // OriginOfCondition — as opposed to the service it was collected from,
  // which is provenance and lives on the batch as `Coverage.scope`.
  optional Subject subject = 4;

  // The source's identifier for this entry, when it has one, so incremental
  // collection can resume and consumers can deduplicate. Its namespace is the
  // batch's `Coverage.scope` — the log service — so the deduplication key is
  // (endpoint_id, coverage.scope, entry_id): two services on one endpoint both
  // number their entries from 1. A service that is cleared reuses its ids; a
  // consumer that must survive that also compares `occurred_at`. Deliberately
  // no uniqueness constraint on the records list: sources that do not stamp
  // entries leave this absent, and a key that can be absent cannot decide
  // duplicates.
  //
  // It is also the only order among records that share an `occurred_at`:
  // devices stamp entries to the second, and a burst lands many records on
  // one instant, which canonical order then sorts by severity and message.
  // The device's sequence survives only here, as the device spells it — a
  // string, so a consumer restoring order compares numerically when the
  // source numbers its entries and treats the ids as opaque otherwise.
  optional string entry_id = 5 [(nv.telemetry.options.v1.field_invariant) = {
    non_empty: true
    max_len: 256
  }];

  optional Value.Map attributes = 6;
}

// The logs payload domain.
message Logs {
  option (nv.telemetry.options.v1.message_invariant) = {validated: true};

  repeated LogRecord records = 1 [(nv.telemetry.options.v1.field_invariant) = {
    unordered: true
    max_items: 65536
  }];
}
