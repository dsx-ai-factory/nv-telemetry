// Signal identity and metadata: the canonical key that acquisition routes
// agree on, and the descriptor carrying what a signal *is* — identity, kind,
// unit, and the range the sensor can read.
//
// Metadata and samples are projected separately, and every route to the same
// signal — a Sensor resource, an EnvironmentMetrics property, a MetricReport
// entry — reduces to the same key, so the planner can change acquisition
// routes without changing public reading identity. What a signal is stops at
// what cannot be written: device-settable configuration such as alarm
// thresholds is observed as resource state instead, because carrying it in
// both places would give one fact two representations that can disagree.

syntax = "proto3";

package nv.telemetry.v1;

import "nv/telemetry/options/v1/annotations.proto";
import "nv/telemetry/v1/subject.proto";
import "nv/telemetry/v1/value.proto";

option csharp_namespace = "Nvidia.NvTelemetry.V1";
option go_package = "github.com/NVIDIA/nv-telemetry/gen/nv/telemetry/v1;telemetryv1";
option java_package = "com.nvidia.nvtelemetry.v1";

// The canonical identity of one signal.
message SignalKey {
  option (nv.telemetry.options.v1.message_invariant) = {
    validated: true
    hashable: true
  };

  // The resource the signal belongs to. Keys reduce to the resource denoted:
  // a metric report naming a reading with a property fragment the sensor
  // resource does not use still reduces to this subject, at key construction
  // rather than at each join.
  optional Subject subject = 1 [(nv.telemetry.options.v1.field_invariant) = {required: true}];

  // Which of the resource's signals, where one resource carries several — a
  // power supply reporting both watts and kilowatt-hours. Absent when the
  // resource carries a single signal, which is a different key from a facet
  // that is present and empty — hence `non_empty` rather than a convention
  // that treats the two alike.
  optional string facet = 2 [(nv.telemetry.options.v1.field_invariant) = {
    non_empty: true
    max_len: 128
  }];
}

// The range a sensor can read. Not alarm thresholds: a threshold is writable
// on most implementations, which makes it resource state.
message ValueRange {
  option (nv.telemetry.options.v1.message_invariant) = {validated: true};

  // At least one bound must be present, and min must not exceed max — both
  // wrapper rules, since the vocabulary has no cross-field constraints.
  optional NumericValue min = 1;

  optional NumericValue max = 2;
}

// What a signal is. Immutable: a refresh reporting an unchanged definition is
// the same descriptor, so revision counting — a catalog concern, not a wire
// one — counts real definition changes rather than polls.
message SignalDescriptor {
  option (nv.telemetry.options.v1.message_invariant) = {validated: true};

  optional SignalKey key = 1 [(nv.telemetry.options.v1.field_invariant) = {required: true}];

  // What the signal measures — temperature, power, energy — in the
  // contract's vocabulary. A string rather than an enum because source
  // reading types are open sets; projection maps and validates them.
  optional string kind = 2 [(nv.telemetry.options.v1.field_invariant) = {
    non_empty: true
    max_len: 128
  }];

  // Unit of every sample under this key, in UCUM. Absent means the unit is not
  // known — the source stated none — never that the signal is dimensionless:
  // a count or a ratio carries UCUM's unity, "1". A consumer may combine two
  // "1" signals and must not combine two whose units it does not know.
  optional string unit = 3 [(nv.telemetry.options.v1.field_invariant) = {
    non_empty: true
    max_len: 64
  }];

  optional ValueRange range = 4;

  // Whether a sample is the signal's current value or a running total. Absent
  // when the source does not say; never UNSPECIFIED.
  optional Accumulation accumulation = 5 [(nv.telemetry.options.v1.field_invariant) = {reject_unspecified: true}];
}

// How a signal's samples relate over time. A consumer exports a running total
// as a counter, which rates and sums correctly across scrapes, and a current
// value as a gauge.
enum Accumulation {
  ACCUMULATION_UNSPECIFIED = 0;

  // The value now, which may rise or fall: a temperature, a power draw.
  ACCUMULATION_INSTANT = 1;

  // A total the device accumulates, such as energy or error counts. It only
  // grows, except when the device resets it, which a sample may date with
  // `Reading.accumulation_start`.
  ACCUMULATION_CUMULATIVE = 2;
}
