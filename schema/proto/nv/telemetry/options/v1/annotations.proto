// Annotation vocabulary for the nv-telemetry observation contract.
//
// These options state what a valid message is. Protocol knowledge is
// deliberately absent: source mappings live in nv.telemetry.mapping.v1
// manifests so that the core schema stays protocol-neutral and one field does
// not accumulate one option per protocol.
//
// The vocabulary is deliberately ours rather than protovalidate's. The
// compiler is a component this project owns and must own anyway, for wrappers,
// canonical form, hashing, and projections; adding a second constraint
// vocabulary with its own toolchain would split the invariants across two
// systems that fail differently. See docs/EXTENSIONS.md for the numbering.

syntax = "proto3";

package nv.telemetry.options.v1;

import "google/protobuf/descriptor.proto";

option csharp_namespace = "Nvidia.NvTelemetry.Options.V1";
option go_package = "github.com/NVIDIA/nv-telemetry/gen/nv/telemetry/options/v1;optionsv1";
option java_package = "com.nvidia.nvtelemetry.options.v1";

// Constraints on a single field.
message FieldInvariant {
  // The zero value is meaningful, exempting this field from the presence
  // lint. Without either this or `optional`, an unset scalar and a scalar set
  // to zero are the same bytes, which would let an absent reading decode as
  // 0.0.
  //
  // A field declared this way is always hashed, because there is no "present"
  // to test for. Adding one to a message that is already `hashable` therefore
  // changes every existing hash. Nothing catches that automatically: `buf
  // breaking` compares numbers, types, and cardinality, not the values of
  // custom options. It is a review obligation.
  bool zero_is_meaningful = 1;

  // Floating-point values must be finite, for `double` and `float` alike.
  // A non-finite source value is reported as an invalid field rather than
  // a missing one.
  bool finite = 2;

  // Validators reject a message in which this field is absent. Distinct from
  // presence, which only makes absence observable: this makes it invalid.
  bool required = 3;

  // The order of this repeated field is not semantic, so canonicalization
  // sorts it. Declared per field rather than per message because a message
  // routinely mixes both kinds — a list whose order is data alongside an
  // attribute set whose order is not.
  bool unordered = 4;

  // Upper bound on the length of a repeated field. Explicitly present so
  // that `max_items: 0`, meaning "must be empty", stays distinguishable
  // from no bound at all.
  optional uint32 max_items = 5;

  // Upper bound on a string's length in bytes, or a bytes field's length.
  // On a repeated field the bound is per element.
  optional uint32 max_len = 6;

  // The field records how or when a fact was collected rather than what was
  // observed, so content hashing skips it, and canonical sorting compares it
  // only as a final tiebreaker after every hash-visible field.
  //
  // Without this a hashable message cannot hold collection metadata at all.
  // An observation timestamp or an entity tag changes on every poll, so a
  // hash over them reports that an unchanged device changed — which is the
  // one thing a convergence adapter must never see, and the reason the hash
  // exists. Identity and observed properties are content; when the read
  // happened, and what the source called that representation, are not.
  //
  // Like `zero_is_meaningful`, adding or removing this on a field a hashable
  // message reaches changes existing hashes. The contract lock records
  // option values so the diff is the review surface.
  bool collection_metadata = 7;

  // The value must not be empty, for strings and bytes alike.
  //
  // `required` proves only that the field was set, and for a string the empty
  // string sets it. An identifier that is present but empty is worse than an
  // absent one: it is a well-formed identity that every failed read collapses
  // into, so a subject whose id could not be determined joins to every other
  // such subject instead of being rejected.
  //
  // On a repeated field the check is per element, as `max_len` is. The
  // annotation says what one entry must be, never how many entries there must
  // be — a scope list is legitimately empty, while a scope element never is.
  //
  // Deliberately absent from observed property values. A device that reported
  // an empty string reported something, and rewriting that as invalid would be
  // fabrication in the opposite direction.
  bool non_empty = 8;

  // The enum's zero value is rejected.
  //
  // proto3 requires every enum to have a zero, which this contract spells
  // UNSPECIFIED and reads as "not stated". `required` proves only that the
  // field was set, and a field set to UNSPECIFIED satisfies it — so a batch
  // that does not know its own completeness would pass a check written to
  // establish that it does.
  //
  // The zero value only. A value this build does not recognise is a newer
  // producer naming something real, and rejecting the message would make
  // adding an enum value a breaking change for every older consumer. Unknown
  // values therefore decode, and what to do about one is the consumer's
  // decision rather than the validator's.
  bool reject_unspecified = 9;

  // Names the fields of this repeated field's element type that together
  // identify an element. Validators reject two elements agreeing on all of
  // them. Empty means no uniqueness constraint.
  //
  // Field names rather than a bare `unique` flag, because identity is rarely
  // the whole element: two descriptors for one signal key contradict each
  // other precisely when their units differ, since a consumer then has no way
  // to choose. Comparing whole elements would call that pair distinct.
  //
  // Every named field must be one the element always carries — `required`, or
  // `zero_is_meaningful` and so having no absent state at all. A key that can
  // be absent makes two elements that both omit it duplicates of each other,
  // which is a rejection no author intends. Both spellings are accepted
  // because `required` is itself refused on a `zero_is_meaningful` field, so
  // testing for `required` alone would leave no way to key on one.
  //
  // A field may not be named twice, and may not be repeated on the element
  // type: the first narrows nothing, and the second would make identity turn
  // on the order of that field's own elements.
  repeated string unique_by = 10;
}

// Constraints on a message as a whole.
message MessageInvariant {
  // Emit a validated type: an owned form of this message with private
  // fields, constructed only through a generated builder or fallible
  // conversion from the wire form, both of which run the same checks. The
  // validated shape is not the wire shape — a required oneof becomes an
  // enum, a required field sheds its optionality — because absence the
  // schema forbids is unrepresentable there rather than checked at each use.
  bool validated = 1;

  // Emit logical content hashing: a traversal of present known fields
  // labeled by field number, skipping fields marked `collection_metadata`.
  // The exclusion is transitive: the traversal inherits it through nested
  // messages whether or not they are hashable themselves, so a non-hashable
  // message inside a hashable one still has its collection metadata skipped.
  // Encoded bytes are never hashed, because protobuf encoding is not
  // canonical across implementations.
  //
  // Requires `validated`, because equal content only hashes equal once
  // canonicalization has run.
  bool hashable = 2;

  // Recursion bound for a self-referential message such as Value, counted in
  // logical levels of that type rather than in encoded message levels: one
  // logical level can cost two or three message levels depending on which
  // variant nests. It is stated on the type because a decoder's own limit is
  // a property of the parse, not of one field.
  //
  // It does not translate into a decoder setting. Decoder limits are fixed by
  // the runtime, so this bound has to be chosen to fit underneath one, and
  // the type that carries it should record the arithmetic.
  optional uint32 max_depth = 3;
}

// Constraints on a oneof.
//
// Whether a case is set is a property of a message instance rather than of
// the schema, so the schema rules do not check it. The contract lock records
// it, and generated validators enforce it.
message OneofInvariant {
  // Validators reject a message in which no case is set. Without this, an
  // empty Value is indistinguishable from an explicit null.
  bool required = 1;
}

extend google.protobuf.FieldOptions {
  FieldInvariant field_invariant = 52001;
}

extend google.protobuf.MessageOptions {
  MessageInvariant message_invariant = 52002;
}

extend google.protobuf.OneofOptions {
  OneofInvariant oneof_invariant = 52003;
}

// An enum the canary owns, so that `reject_unspecified` can be round-tripped
// on the declaration kind it applies to. Deliberately not one of the
// contract's: the annotation vocabulary must not import the package it
// annotates.
enum CanaryLevel {
  CANARY_LEVEL_UNSPECIFIED = 0;
  CANARY_LEVEL_STATED = 1;
}

// Self-test for the annotation pipeline.
//
// Custom options survive only on the encoding path that goes through
// reflection; the obvious path drops them without an error, and every
// invariant then reads as its default and silently switches off. The compiler
// asserts these values read back exactly as declared, so that failure mode
// cannot reach a build.
//
// The values here are arbitrary — the canary proves values survive encoding,
// and no arithmetic backs its max_depth the way one backs Value's.
message Canary {
  option (message_invariant) = {
    validated: true
    hashable: true
    max_depth: 8
  };

  optional double reading = 1 [(field_invariant) = {
    finite: true
    required: true
  }];

  repeated string labels = 2 [(field_invariant) = {
    unordered: true
    max_items: 4
    max_len: 32
  }];

  uint64 revision = 3 [(field_invariant) = {zero_is_meaningful: true}];

  optional string trace = 4 [(field_invariant) = {collection_metadata: true}];

  // OneofOptions ride a different options message than FieldOptions and
  // MessageOptions, so the round trip has to cover that path separately.
  oneof probe {
    option (oneof_invariant) = {required: true};

    bool probe_flag = 5;
  }

  optional string name = 6 [(field_invariant) = {non_empty: true}];

  optional CanaryLevel level = 7 [(field_invariant) = {reject_unspecified: true}];

  // An element type for the uniqueness probe. Its `id` is required because
  // `unique_by` demands that of every key it names.
  message Element {
    optional string id = 1 [(field_invariant) = {required: true}];
  }

  // A repeated string is a third reflection shape — neither a bool nor a
  // uint32 — and reading one back wrong yields an empty list, which is
  // indistinguishable from no constraint. That is the failure this proves
  // cannot happen silently.
  repeated Element elements = 8 [(field_invariant) = {
    unique_by: ["id"]
  }];
}
