name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to commits: the publish job must not run code a
      # moved tag brings in. No credential is left in the checkout for the
      # verification builds to read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No cache: a release builds from nothing another workflow could have
      # written.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.95.0"
          cache: false

      # Scoped to this step, so no earlier step can read the credential.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          echo "Publishing version $VERSION"

          sed -i -E '/^\[workspace\.package\]/,/^\[/{s/^version = .*/version = "'"$VERSION"'"/}' Cargo.toml
          sed -i -E 's/^(nv-telemetry-[a-z]+ = \{ path = "[^"]+", version = ")[^"]+(" \})/\1'"$VERSION"'\2/' Cargo.toml
          # Moves only the workspace members' own entries in the lockfile, so
          # every dependency publishes against the versions CI tested.
          cargo update --workspace

          # A manifest line the patterns above missed would publish a crate
          # pinned to the previous release.
          STALE=$(cargo metadata --format-version=1 --no-deps \
            | jq -r --arg v "$VERSION" '.packages[] | select(.version != $v) | .name')
          if [ -n "$STALE" ]; then
            echo "not at $VERSION: $STALE" >&2
            exit 1
          fi
          if grep -E '^nv-telemetry-[a-z]+ = .*version = "' Cargo.toml | grep -v "version = \"$VERSION\""; then
            echo "workspace dependency not at $VERSION" >&2
            exit 1
          fi

          # Publishes every member without `publish = false`, in dependency
          # order.
          cargo publish --workspace --locked --all-features --allow-dirty
