[workspace]
members = [
    "schema",
    "codegen",
    "model",
    "source",
    "sources/redfish",
    "sources/gnmi",
    "orchestration",
    "export",
    "exporters/otlp",
    "exporters/prometheus",
    "examples/probe",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dsx-ai-factory/nv-telemetry"
readme = "README.md"
rust-version = "1.95"
keywords = ["telemetry", "redfish", "bmc", "observability"]
categories = ["hardware-support"]

[workspace.dependencies]
# Workspace members. Dependencies run in one direction: schema -> model ->
# source -> protocol crates -> orchestration -> export -> exporters.
nv-telemetry-schema = { path = "schema", version = "0.1.0" }
nv-telemetry-model = { path = "model", version = "0.1.0" }
nv-telemetry-source = { path = "source", version = "0.1.0" }
nv-telemetry-orchestration = { path = "orchestration", version = "0.1.0" }
nv-telemetry-redfish = { path = "sources/redfish", version = "0.1.0" }
nv-telemetry-export = { path = "export", version = "0.1.0" }

# Protobuf runtime for the generated model. Because generated code is checked
# in, `prost` is the only protobuf dependency a data-plane consumer acquires.
prost = "0.14"
prost-types = "0.14"

# Build-time only. `protox` compiles the schema without a `protoc` binary,
# `prost-reflect` reads custom options as typed values rather than by number,
# and `prost-build` renders wire types from the descriptor set protox already
# produced — so no protobuf compiler is needed at any stage.
protox = "0.9"
prost-reflect = { version = "0.16", features = ["text-format"] }
prost-build = { version = "0.14", features = ["cleanup-markdown"] }
# The gNMI client uses a caller-supplied transport, so tonic's connection
# and TLS features are disabled.
tonic-prost-build = { version = "0.14", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = { version = "0.14", default-features = false }

# Build-time only, and already in the tree through prost-build: the model
# emitter assembles `quote` token streams, proves they parse as a Rust file
# with `syn` — so a template bug fails generation rather than the downstream
# build — and renders them with `prettyplease`, so nothing hand-manages
# formatting.
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing"] }
prettyplease = "0.2"
quote = "1"
proc-macro2 = "1"

# Build-time only, and the same crate prost-build itself converts names with.
# The model emitter derives module paths and type names that must land on what
# prost-build generated — `GPUState` names the module `gpu_state`, not
# `g_p_u_state` — so both sides must run one algorithm, not two that agree on
# easy inputs.
heck = "0.5"

# The Redfish client: typed DMTF schema models over a transport-agnostic
# `Bmc` trait. A private dependency of `sources/redfish`, which reads through
# the embedder's transport, so default features are off and the HTTP stack
# (reqwest, tokio) enters the tree only for the probe; the mock implements
# the same trait for transport-free tests.
nv-redfish = { version = "0.20", default-features = false }
nv-redfish-bmc-mock = "0.20"

# Build-time only, for the projection compiler: the same CSDL parser and
# vendored DMTF bundle that nv-redfish generates its typed models from.
nv-redfish-csdl-compiler = "0.20"
nv-redfish-schema = "0.20"
nv-redfish-dispatcher = "0.20"
# The instant type behind nv-redfish's `Edm.DateTimeOffset`; `sources/redfish`
# reads seconds and nanos off it for the contract's `Timestamp`.
time = { version = "0.3", default-features = false }
futures-timer = "3"
# `lock::Mutex` runs the polls of one log read one at a time without binding
# the library to a runtime; the crate is already in the graph via nv-redfish.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
url = "2"

# The one hand-written Redfish document shape: a raw entries page, read for
# the paging annotations nv-redfish's typed collections drop.
serde = { version = "1", default-features = false, features = ["derive"] }
# A random id per opened event stream: the scope that keeps a device's
# per-boot `EventId`s from colliding across streams. The crate is already in
# the tree through nv-redfish's `Edm.Guid`; the `v4` feature, and the
# randomness source it pulls in, is this workspace's.
uuid = { version = "1", features = ["v4"] }

# Documents and event payloads as `sources/redfish`'s transport hands them
# over, so part of its public API; also the corpus fixtures' JSON.
serde_json = "1"

# Dev-only, and the probe's.
tempfile = { version = "3", default-features = false }
# The collector's executor: one task per endpoint, its timers, and the
# reports channel. No tokio type appears in a public signature. Also the
# executor the async tests and the probe run on.
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

# Dev-only: `tokio_stream::iter` builds a test fixture's streamed
# `Acquire::Output` without a real transport. A streamed provider's crate
# supplies its own `Stream` bound.
tokio-stream = "0.1"

# Benchmarks measure instruction counts under Valgrind, so numbers are
# machine-load independent and comparable across runs. Dev-only; running
# needs valgrind and a gungraun-runner of the same version.
gungraun = "0.19.4"

# Property-based tests over the model's central claims — the encoder's byte
# identity with prost, order-independence of canonical bytes and hashes, and
# the total-order laws — on inputs no fixture thought of. Dev-only.
proptest = { version = "1", default-features = false, features = ["std"] }


# CI runs clippy with `-D warnings`, so everything below is effectively an
# error. Lints live here rather than in the CI invocation so that an editor
# reports exactly what the pipeline will.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
# Hand-written records in the model are #[non_exhaustive] and every invariant
# carrier keeps its fields private, so this holds the line on that convention.
# Generated wire types are exempt by a local allow: their exhaustive shape is
# the point, and construction goes through generated builders anyway.
exhaustive_structs = "warn"

# Exact float comparison is the design of the finite-float type, not an
# oversight: it exists so that observations can be diffed and hashed
# bit-for-bit.
float_cmp = "allow"
# The model is almost entirely pure accessors, so this fires on nearly every
# method and says nothing useful.
must_use_candidate = "allow"
