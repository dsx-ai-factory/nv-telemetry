[package]
name = "nv-telemetry-redfish"
description = "Redfish acquisition for nv-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nv-telemetry-model.workspace = true
nv-telemetry-source.workspace = true
# `chassis` is what makes Sensor reachable from ServiceRoot: generation is
# rooted there, and an unreachable schema type is not emitted at all.
nv-redfish = { workspace = true, features = ["sensors", "chassis"] }
# Optional so the `bmc-mock` feature can gate a `ClassifyError` impl for the
# mock's error type; tests pull it unconditionally through dev-dependencies.
nv-redfish-bmc-mock = { workspace = true, optional = true }

[features]
# The HTTP transport is the default consumer path; without it this crate is
# projection and classification over the `Bmc` trait alone, which is what
# tests compile against.
default = ["bmc-http"]
bmc-http = ["nv-redfish/bmc-http"]
bmc-mock = ["dep:nv-redfish-bmc-mock"]

[dev-dependencies]
nv-redfish-bmc-mock.workspace = true
serde_json.workspace = true
tokio.workspace = true

[[test]]
name = "sensor_read"
path = "tests/sensor_read.rs"
required-features = ["bmc-mock"]

[[test]]
name = "chassis_read"
path = "tests/chassis_read.rs"
required-features = ["bmc-mock"]

[lints]
workspace = true
