[package]
name = "nv-telemetry-redfish"
description = "Redfish acquisition for nv-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
nv-telemetry-model.workspace = true
nv-telemetry-source.workspace = true
# `chassis` is what makes Sensor reachable from ServiceRoot: generation is
# rooted there, and an unreachable schema type is not emitted at all.
# `log-services` brings LogService, its entries collection, and LogEntry.
# `event-service` brings EventService, the SSE payload types, and the
# vendor patches that make some devices' event records deserialize.
nv-redfish = { workspace = true, features = ["sensors", "chassis", "log-services", "event-service", "update-service"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
futures-timer.workspace = true
futures-util.workspace = true
uuid.workspace = true

[dev-dependencies]
nv-redfish-bmc-mock.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
