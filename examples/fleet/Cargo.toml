[package]
name = "nv-telemetry-fleet"
description = "Example daemon: acquires a fleet of Redfish and gNMI endpoints and prints what it collects"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util.workspace = true
nv-redfish = { workspace = true, features = ["bmc-http"] }
nv-telemetry-gnmi = { path = "../../sources/gnmi" }
nv-telemetry-model.workspace = true
nv-telemetry-orchestration.workspace = true
nv-telemetry-probe = { path = "../probe" }
nv-telemetry-redfish.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time"] }
toml.workspace = true
tonic = { workspace = true, features = ["channel", "tls-ring", "tls-native-roots"] }
url.workspace = true

[lints]
workspace = true
